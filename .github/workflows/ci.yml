name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual retry lever: the 2026-08-06 GitHub Actions outage left pushes
  # with no run created and no way to re-trigger without an empty commit.
  workflow_dispatch:

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin contract
        run: python tools/validate_plugin.py
      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v

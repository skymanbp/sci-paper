name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual retry lever: the 2026-08-06 GitHub Actions outage left pushes
  # with no run created and no way to re-trigger without an empty commit.
  workflow_dispatch:

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate plugin contract
        run: python tools/validate_plugin.py
      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v

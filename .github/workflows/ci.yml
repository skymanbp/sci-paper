name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual retry lever: the 2026-08-06 GitHub Actions outage left pushes
  # with no run created and no way to re-trigger without an empty commit.
  workflow_dispatch:

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate plugin contract
        run: python tools/validate_plugin.py
      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v
